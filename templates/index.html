<div id="map"></div>

<!-- Leaflet 1.9.4 — self-hosted from /static/leaflet/.
     To upgrade: bump the version in static/leaflet/VERSION and re-run the
     download steps documented there. -->
<script src="/static/leaflet/leaflet.js?v={{VERSION}}"></script>
<script>
// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map').setView([56.0, 10.5], 7);

// Dataforsyningen WMS token, injected by the server from the
// DATAFORSYNINGEN_TOKEN environment variable. Empty string means the
// satellite basemap is unavailable in this deployment and the dropdown
// option is hidden. Token is intentionally exposed to the browser —
// that's how Dataforsyningen public tokens are designed to be used.
const DATAFORSYNINGEN_TOKEN = '__DATAFORSYNINGEN_TOKEN__';
const HAS_ORTOFOTO = DATAFORSYNINGEN_TOKEN.length > 0;

const BASEMAPS = {
  osm: {
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
    maxZoom: 19,
  },
  topo: {
    url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    attribution: 'Map data: © OpenStreetMap contributors, map style: © OpenTopoMap',
    maxZoom: 17,
  },
};

const basemapLayers = Object.fromEntries(
  Object.entries(BASEMAPS).map(([k, cfg]) => [k, L.tileLayer(cfg.url, cfg)])
);

// Satellite basemap: GeoDanmark ortofoto (10 cm spring imagery) served as
// WMS by Dataforsyningen. Leaflet asks for tiles in EPSG:3857 (its
// default CRS) and the WMS reprojects on the fly from the source data's
// EPSG:25832. Layer is registered alongside OSM/Topo only when a token
// is present; otherwise the dropdown option is omitted.
if (HAS_ORTOFOTO) {
  basemapLayers.satellite = L.tileLayer.wms(
    'https://api.dataforsyningen.dk/orto_foraar_DAF',
    {
      layers: 'orto_foraar',
      format: 'image/jpeg',
      version: '1.3.0',
      // NB: Dataforsyningen's WMS validates TRANSPARENT case-strictly and
      // rejects Leaflet's default lowercase `false`. Send the uppercase
      // string explicitly. JPEG can't be transparent anyway, so this is
      // purely about getting past server-side validation.
      transparent: 'FALSE',
      token: DATAFORSYNINGEN_TOKEN,
      attribution: '© <a href="https://dataforsyningen.dk/data/981" target="_blank" rel="noopener">SDFI / GeoDanmark</a>',
      // Don't load satellite tiles at country-overview zoom levels — each
      // WMS request is expensive (server-side reprojection) and loading
      // all of Denmark at zoom <12 would fire hundreds of requests and
      // hang the browser. Force a minimum zoom so the layer only activates
      // when the user is already looking at a reasonably small area.
      minZoom: 12,
      maxZoom: 21,
      // Source data varies by area — 10 cm where available, 12.5 cm elsewhere.
      // Let Leaflet upscale tiles past the WMS's native resolution rather than
      // fall back to a blank tile.
      maxNativeZoom: 20,
      // Limit tile requests to Denmark's bounding box so Leaflet never
      // asks the WMS for tiles over the sea or neighbouring countries.
      bounds: L.latLngBounds([54.5, 7.9], [57.9, 15.3]),
    },
  );
}

let currentBasemap = localStorage.getItem('nosy-basemap') || 'osm';
if (!basemapLayers[currentBasemap]) currentBasemap = 'osm';
// If satellite was saved as preferred basemap but the initial zoom is below
// minZoom, fall back to OSM for the initial render to avoid a blank map.
// The user can switch to satellite once they have zoomed in.
if (currentBasemap === 'satellite' && map.getZoom() < 12) currentBasemap = 'osm';
basemapLayers[currentBasemap].addTo(map);

const mapControl = L.control({ position: 'topright' });
mapControl.onAdd = function () {
  const el = L.DomUtil.create('div', 'leaflet-control nosy-map-control');
  const satelliteOption = HAS_ORTOFOTO
    ? '<option value="satellite">Satelit (GeoDanmark)</option>'
    : '';
  el.innerHTML = `
    <label class="map-control-item" for="basemap-select">Kortlag
      <select id="basemap-select" aria-label="Vælg kortlag">
        <option value="osm">Standard kort</option>
        <option value="topo">Topografisk kort</option>
        ${satelliteOption}
      </select>
    </label>
    <label class="map-control-item map-toggle" for="toggle-matrikler">
      <input id="toggle-matrikler" type="checkbox" checked>
      Vis matrikler
    </label>
    <button type="button" class="map-control-item map-link-btn" id="aerial-link-btn"
            title="Åbn det viste område i Skråfoto/Luftfoto på en ny fane">
      Luftfoto ↗
    </button>
  `;
  L.DomEvent.disableClickPropagation(el);
  L.DomEvent.disableScrollPropagation(el);
  return el;
};
mapControl.addTo(map);

const matrikelLayer = L.layerGroup().addTo(map);
const matrikelGeometryCache = new Map();
const MATRIKEL_COLORS = ['#dc2626', '#2563eb', '#16a34a', '#d97706', '#7c3aed', '#0891b2', '#be123c', '#0369a1', '#65a30d', '#9333ea'];
let showMatrikler = localStorage.getItem('nosy-show-matrikler') !== '0';
let matrikelSyncToken = 0;

function setBasemap(key) {
  if (!basemapLayers[key] || key === currentBasemap) return;
  map.removeLayer(basemapLayers[currentBasemap]);
  // Satellite layer has minZoom:12 to avoid loading hundreds of expensive
  // WMS tiles at country-overview zoom levels. If the user switches to
  // satellite while zoomed out, snap them to minZoom so tiles load immediately
  // instead of showing a blank map.
  if (key === 'satellite' && map.getZoom() < 12) {
    map.setZoom(12);
  }
  basemapLayers[key].addTo(map);
  currentBasemap = key;
  localStorage.setItem('nosy-basemap', key);
}

// ── Skraafoto / Luftfoto deeplink ──────────────────────────────────────────
// The skraafoto viewer expects a center coordinate in EPSG:25832 metres.
// For addresses and map-clicks the server already projects coordinates
// (epsg_25832 / click_epsg_25832), which keeps the math out of the
// browser. For the "Luftfoto" map-control button we may not have a
// selected entry yet, so we fall back to projecting the current map
// centre client-side.
//
// The client-side fallback uses a self-contained UTM forward formula
// (no proj4 dependency). Accurate to <2 m anywhere in Denmark, which
// is more than enough to centre a viewer at zoom 17+.
function wgs84ToUtm32(lat, lng) {
  const a = 6378137.0;                       // GRS80 semi-major
  const f = 1 / 298.257222101;               // GRS80 flattening
  const k0 = 0.9996;
  const e2 = f * (2 - f);
  const ep2 = e2 / (1 - e2);
  const lon0 = 9 * Math.PI / 180;            // UTM zone 32N central meridian
  const phi = lat * Math.PI / 180;
  const lam = lng * Math.PI / 180;
  const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2);
  const T = Math.tan(phi) ** 2;
  const C = ep2 * Math.cos(phi) ** 2;
  const A = Math.cos(phi) * (lam - lon0);
  const M = a * (
    (1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi
    - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi)
    + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi)
    - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi)
  );
  const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6
            + (5 - 18 * T + T ** 2 + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  const y = k0 * (M + N * Math.tan(phi) * (A ** 2 / 2
            + (5 - T + 9 * C + 4 * C ** 2) * A ** 4 / 24
            + (61 - 58 * T + T ** 2 + 600 * C - 330 * ep2) * A ** 6 / 720));
  return { x, y };
}

function skraafotoUrl(epsg, latlng) {
  let xy = epsg;
  if ((!xy || !Number.isFinite(xy.x) || !Number.isFinite(xy.y)) && latlng) {
    xy = wgs84ToUtm32(latlng.lat, latlng.lng);
  }
  if (!xy || !Number.isFinite(xy.x) || !Number.isFinite(xy.y)) return null;
  return `https://skraafoto.dataforsyningen.dk/?center=${xy.x.toFixed(2)},${xy.y.toFixed(2)}&orientation=north`;
}

// Pick the best coordinate for the map-control "Luftfoto" button: most
// recent entry (server-projected) > map centre (client-projected).
function openAerialFromMapControl() {
  // Prefer the most recently added entry whose server response carried a
  // projected coord. Walk backwards so the user gets feedback aligned
  // with what they last interacted with.
  for (let i = entries.length - 1; i >= 0; i--) {
    const e = entries[i];
    if (e.epsg_25832) {
      const url = skraafotoUrl(e.epsg_25832, null);
      if (url) { window.open(url, '_blank', 'noopener'); return; }
    }
    if (Number.isFinite(e.lat) && Number.isFinite(e.lng)) {
      const url = skraafotoUrl(null, { lat: e.lat, lng: e.lng });
      if (url) { window.open(url, '_blank', 'noopener'); return; }
    }
  }
  const c = map.getCenter();
  const url = skraafotoUrl(null, { lat: c.lat, lng: c.lng });
  if (url) window.open(url, '_blank', 'noopener');
}

function matrikelColorForIndex(i) {
  return MATRIKEL_COLORS[i % MATRIKEL_COLORS.length];
}

async function fetchMatrikelGeometry(matrikelnummer, ejerlavskode, ejerlavsnavn) {
  const key = `${matrikelnummer}|${ejerlavskode || ''}|${ejerlavsnavn || ''}`;
  if (matrikelGeometryCache.has(key)) return matrikelGeometryCache.get(key);

  const params = new URLSearchParams({ matrikelnr: matrikelnummer });
  if (ejerlavskode) {
    params.set('ejerlavskode', ejerlavskode);
  } else if (ejerlavsnavn) {
    params.set('ejerlavsnavn', ejerlavsnavn);
  }

  const res = await fetch(`/api/matrikel-geometry?${params.toString()}`);
  if (!res.ok) throw new Error(`Matrikel lookup failed (${res.status})`);
  const geojson = await res.json();
  matrikelGeometryCache.set(key, geojson);
  return geojson;
}

async function syncMatrikelOverlay() {
  const token = ++matrikelSyncToken;
  matrikelLayer.clearLayers();
  if (!showMatrikler) return;

  const tasks = [];
  entries.forEach((entry, idx) => {
    const mats = entry?.data?.matrikler || [];
    mats.forEach(m => {
      const matrikelnummer = (m.matrikelnummer || '').trim();
      const ejerlavskode = String(m.landsejerlavkode || '').trim();
      const ejerlavsnavn = (m.landsejerlavnavn || '').trim();
      if (!matrikelnummer) return;
      tasks.push({ entry, idx, matrikelnummer, ejerlavskode, ejerlavsnavn });
    });
    // Matrikel-click entries that haven't yet received their tingbog still
    // carry the clicked parcel's GeoJSON from /api/click. Paint it eagerly so
    // the user sees their selection while the slow tingbog lookup runs.
    if (entry.lookupMode === 'matrikel' && !entry.data && entry.clickGeometry) {
      const color = matrikelColorForIndex(idx);
      const popup = `<strong>#${idx + 1}</strong> ${esc(entry.label)}<br>Henter tingbog…`;
      L.geoJSON(entry.clickGeometry, {
        style: { color, weight: 2, opacity: 0.95, fillColor: color, fillOpacity: 0.14, dashArray: '4 4' },
        onEachFeature: (_, layer) => layer.bindPopup(popup),
      }).addTo(matrikelLayer);
    }
  });

  const settled = await Promise.allSettled(tasks.map(async t => ({
    ...t,
    geojson: await fetchMatrikelGeometry(t.matrikelnummer, t.ejerlavskode, t.ejerlavsnavn),
  })));
  if (token !== matrikelSyncToken) return;

  settled.forEach(result => {
    if (result.status !== 'fulfilled') return;
    const { entry, idx, matrikelnummer, ejerlavsnavn, geojson } = result.value;
    const color = matrikelColorForIndex(idx);
    const label = entry?.label || 'Ukendt adresse';
    const popup = `<strong>#${idx + 1}</strong> ${esc(label)}<br>Matrikel: <strong>${esc(matrikelnummer)}</strong><br>${esc(ejerlavsnavn || 'Ukendt ejerlav')}`;
    L.geoJSON(geojson, {
      style: {
        color,
        weight: 2,
        opacity: 0.95,
        fillColor: color,
        fillOpacity: 0.14,
      },
      onEachFeature: (_, layer) => layer.bindPopup(popup),
    }).addTo(matrikelLayer);
  });
}

function initMapControls() {
  const basemapSelect = document.getElementById('basemap-select');
  if (basemapSelect) {
    basemapSelect.value = currentBasemap;
    basemapSelect.addEventListener('change', e => setBasemap(e.target.value));
  }

  const matrikelToggle = document.getElementById('toggle-matrikler');
  if (matrikelToggle) {
    matrikelToggle.checked = showMatrikler;
    matrikelToggle.addEventListener('change', e => {
      showMatrikler = !!e.target.checked;
      localStorage.setItem('nosy-show-matrikler', showMatrikler ? '1' : '0');
      syncMatrikelOverlay();
    });
  }

  const aerialBtn = document.getElementById('aerial-link-btn');
  if (aerialBtn) {
    aerialBtn.addEventListener('click', openAerialFromMapControl);
  }
}

initMapControls();

// entries: [{ label, lat, lng, data, error, loading, marker }]
const entries = [];

// ── Mobile sidebar drawer ────────────────────────────────────────────────
// Below 768px the sidebar is an off-canvas drawer. body.sidebar-open is the
// single source of truth; CSS transitions the translateX.
function isMobileViewport() {
  // Keep in sync with the @media rules in style.css.
  return window.matchMedia('(max-width: 767px), (max-height: 500px) and (max-width: 900px)').matches;
}
function openSidebarMobile() {
  if (!isMobileViewport()) return;
  document.body.classList.add('sidebar-open');
  const btn = document.getElementById('sidebar-toggle');
  if (btn) btn.setAttribute('aria-expanded', 'true');
}
function closeSidebarMobile() {
  document.body.classList.remove('sidebar-open');
  const btn = document.getElementById('sidebar-toggle');
  if (btn) btn.setAttribute('aria-expanded', 'false');
  // Let the drawer finish sliding out, then tell Leaflet to re-measure.
  setTimeout(() => { if (window.map && map.invalidateSize) map.invalidateSize(); }, 300);
}
function toggleSidebarMobile() {
  if (document.body.classList.contains('sidebar-open')) {
    closeSidebarMobile();
  } else {
    document.body.classList.add('sidebar-open');
    const btn = document.getElementById('sidebar-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'true');
  }
}
// Some mobile browsers fail to fire a synthetic click after touchstart if
// any micro-movement occurs, because the gesture detector claims the
// sequence. Reproduced on both Android Chrome (Xiaomi/MIUI) and iOS Safari
// (iPhone 16). Bind touchend explicitly as a fallback and guard against
// double-fire with a short cooldown.
(function bindSidebarToggleRobust() {
  let lastFire = 0;
  function fire(e) {
    const now = Date.now();
    if (now - lastFire < 400) return; // de-dup click + touchend
    lastFire = now;
    if (e && e.cancelable) e.preventDefault();
    try { toggleSidebarMobile(); } catch (err) { console.error('toggle failed', err); }
  }
  function attach() {
    const btn = document.getElementById('sidebar-toggle');
    if (!btn) { setTimeout(attach, 50); return; }
    // Remove inline onclick so we own the event entirely.
    btn.onclick = null;
    btn.addEventListener('click', fire);
    btn.addEventListener('touchend', fire, { passive: false });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else {
    attach();
  }
})();
// Close drawer on viewport resize into desktop range (e.g. orientation change).
window.addEventListener('resize', () => {
  if (!isMobileViewport() && document.body.classList.contains('sidebar-open')) {
    closeSidebarMobile();
  }
});

let loanAssumption = 'deferred_10y';

function setLoanAssumption(type) {
  loanAssumption = type;
  renderSidebar();
}

function loanAgeMonths(alias) {
  const datePart = alias ? alias.split('-')[0] : null;
  if (!datePart) return null;
  try {
    const [d, m, y] = datePart.split('.').map(Number);
    const reg = new Date(y, m - 1, d);
    if (isNaN(reg.getTime())) return null;
    const now = new Date();
    // Bug 13: use day-difference for more accurate month count (avg 30.44 days/month)
    const dayDiff = (now - reg) / 86400000;
    if (dayDiff < 0) return null;
    return Math.round(dayDiff / 30.44);
  } catch { return null; }
}

function outstandingBalance(principal, annualRatePct, monthsElapsed, type) {
  if (monthsElapsed === null || monthsElapsed <= 0) return principal;
  const r = annualRatePct / 100 / 12;

  function annuityRemaining(P, r, n, k) {
    k = Math.min(k, n);
    if (k >= n) return 0;
    if (r === 0) return P * (n - k) / n;
    return P * (Math.pow(1 + r, n) - Math.pow(1 + r, k)) / (Math.pow(1 + r, n) - 1);
  }

  if (type === 'interest_only') return principal;
  if (type === 'repayment')     return annuityRemaining(principal, r, 360, monthsElapsed);
  if (type === 'deferred_10y') {
    if (monthsElapsed <= 120) return principal;
    return annuityRemaining(principal, r, 240, monthsElapsed - 120);
  }
  return principal;
}

function numberedIcon(n) {
  return L.divIcon({
    html: `<div class="map-pin">${n}</div>`,
    className: '',
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    popupAnchor: [0, -14],
  });
}

map.on('click', async e => {
  if (entries.length >= 10) return;
  const { lat, lng } = e.latlng;
  // Map clicks are spatial, not textual: ask DAWA which jordstykke
  // (cadastral parcel) the click falls inside, then drive the tinglysning
  // lookup off that matrikel. Avoids the 500 m haversine guess that could
  // otherwise resolve a click on parcel A to an address on neighbouring
  // parcel B.
  let res;
  try {
    res = await fetch(`/api/click?lat=${lat}&lng=${lng}`);
  } catch {
    return;
  }
  if (!res.ok) return;
  const hit = await res.json();
  input.value = '';
  addMatrikel(hit);
});

// ── Autocomplete ───────────────────────────────────────────────────────────
const input = document.getElementById('search-input');
const gpsBtn = document.getElementById('gps-btn');
const searchFeedback = document.getElementById('search-feedback');
const suggestionsEl = document.getElementById('suggestions');
let debounceTimer;
let currentSuggestions = [];
let suggestController = null;
let suggestSeq = 0;
let gpsBusy = false;

function setSearchFeedback(message, type = 'info') {
  if (!searchFeedback) return;
  if (!message) {
    searchFeedback.hidden = true;
    searchFeedback.textContent = '';
    searchFeedback.className = '';
    return;
  }
  searchFeedback.hidden = false;
  searchFeedback.textContent = message;
  searchFeedback.className = `feedback-${type}`;
}

function setGpsBusy(isBusy) {
  gpsBusy = isBusy;
  if (!gpsBtn) return;
  gpsBtn.disabled = isBusy;
  gpsBtn.classList.toggle('is-loading', isBusy);
}

async function locateMe() {
  if (gpsBusy) return;
  if (entries.length >= 10) {
    setSearchFeedback('Maks. 10 adresser nået - fjern en for at tilføje nye.', 'error');
    return;
  }
  if (!navigator.geolocation) {
    setSearchFeedback('Din browser understøtter ikke GPS-geolokation.', 'error');
    return;
  }

  setSearchFeedback('Finder din position…');
  setGpsBusy(true);

  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const res = await fetch(`/api/reverse?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`);
      if (!res.ok) {
        let detail = null;
        try {
          const body = await res.json();
          detail = body && body.detail;
        } catch {
          detail = null;
        }
        setSearchFeedback(detail || 'Kunne ikke finde en adresse ved din position.', 'error');
        return;
      }

      const resolved = await res.json();
      hideSuggestions();
      hideHistory();
      input.value = '';
      map.setView([resolved.lat, resolved.lng], 16);
      setSearchFeedback('Adresse fundet via GPS.');
      addAddress(resolved.label, resolved.lat, resolved.lng, resolved.epsg_25832 || null);
    } catch {
      setSearchFeedback('GPS-opslag fejlede. Prøv igen.', 'error');
    } finally {
      setGpsBusy(false);
    }
  }, err => {
    const code = err && err.code;
    const msg = code === 1
      ? 'GPS-adgang blev afvist. Tillad lokation i browseren og prøv igen.'
      : code === 2
        ? 'Kunne ikke bestemme din position.'
        : 'GPS-opslag timed out. Prøv igen.';
    setSearchFeedback(msg, 'error');
    setGpsBusy(false);
  }, {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 60000,
  });
}

input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  setSearchFeedback('');
  const q = input.value.trim();
  if (q.length < 2) {
    if (suggestController) suggestController.abort();
    suggestSeq++;  // invalidate any in-flight response
    hideSuggestions();
    return;
  }
  debounceTimer = setTimeout(() => fetchSuggestions(q), 120);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideSuggestions(); hideHistory(); }
  if (e.key === 'Enter' && currentSuggestions.length > 0) {
    selectSuggestion(currentSuggestions[0]);
  }
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search-box')) { hideSuggestions(); hideHistory(); }
});

async function fetchSuggestions(q) {
  hideHistory();
  // Cancel any in-flight request so a slow earlier response can't overwrite a newer one.
  if (suggestController) suggestController.abort();
  suggestController = new AbortController();
  const mySeq = ++suggestSeq;
  let data;
  try {
    const res = await fetch(`/api/autocomplete?q=${encodeURIComponent(q)}`, { signal: suggestController.signal });
    data = await res.json();
  } catch (err) {
    if (err.name === 'AbortError') return;
    return;
  }
  // Drop result if a newer request has been kicked off in the meantime.
  if (mySeq !== suggestSeq) return;
  currentSuggestions = data;
  if (!currentSuggestions.length) { hideSuggestions(); return; }
  suggestionsEl.innerHTML = currentSuggestions
    .map((s, i) => `<div class="suggestion" data-i="${i}">${esc(s.label)}</div>`)
    .join('');
  suggestionsEl.hidden = false;
  suggestionsEl.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => selectSuggestion(currentSuggestions[+el.dataset.i]));
  });
}

function hideSuggestions() {
  suggestionsEl.hidden = true;
}

function selectSuggestion(s) {
  if (s.type === 'vejnavn') {
    // Refine: put street name in the input so user can type house number.
    input.value = s.vejnavn + ' ';
    input.focus();
    hideSuggestions();
    fetchSuggestions(input.value.trim());
    return;
  }
  input.value = '';
  hideSuggestions();
  if (entries.length >= 10) return;
  map.setView([s.lat, s.lng], 16);
  addAddress(s.label, s.lat, s.lng, s.epsg_25832 || null);
}

// ── Multi-address management ───────────────────────────────────────────────
async function addAddress(label, lat, lng, epsg25832 = null) {
  // Bug 9: reject duplicates (same label already in the list). Scroll the
  // existing entry into view rather than silently returning, so the search
  // still gives visual feedback.
  const dupIdx = entries.findIndex(e => e.label === label);
  if (dupIdx !== -1) {
    openSidebarMobile();
    scrollToEntry(dupIdx);
    return;
  }
  openSidebarMobile();
  const idx = entries.length;
  const marker = L.marker([lat, lng], { icon: numberedIcon(idx + 1) }).addTo(map);
  marker.on('click', () => { openSidebarMobile(); scrollToEntry(idx); });

  const entry = {
    label, lat, lng,
    epsg_25832: epsg25832 || null,
    data: null, error: null, loading: true, status: null,
    marker, salesHistory: null, salesLoading: true,
    lookupMode: 'address',
  };
  entries.push(entry);
  renderSidebar();
  scrollToEntry(idx);

  await loadEntry(entry);
  scrollToEntry(entries.indexOf(entry));

  // Fetch sales history in the background; re-render when done.
  fetch(`/api/sales-history?q=${encodeURIComponent(label)}`)
    .then(r => r.ok ? r.json() : null)
    .then(sh => { entry.salesHistory = sh; })
    .catch(() => { /* ignore — optional enrichment */ })
    .finally(() => {
      // Bug 14: entry may have been removed while fetch was in flight
      if (!entries.includes(entry)) return;
      entry.salesLoading = false;
      renderSidebar();
    });
}

// Add an entry resolved from a map click (matrikel-first flow). The click
// gave us the cadastral parcel under the cursor; tinglysning is then looked
// up via that matrikel. Sales history is skipped because there is no
// definitive single address tied to a raw matrikel click.
async function addMatrikel(hit) {
  const matrikelnr = (hit.matrikelnr || '').trim();
  const ejerlavkode = String(hit.ejerlavkode || '').trim();
  const ejerlavsnavn = (hit.ejerlavsnavn || '').trim();
  if (!matrikelnr || !ejerlavkode) return;

  const provisionalLabel = ejerlavsnavn
    ? `Matrikel ${matrikelnr}, ${ejerlavsnavn}`
    : `Matrikel ${matrikelnr}`;
  // Reject duplicates by matrikel identity rather than label, because the
  // label is rewritten to the parent address once the tingbog comes back.
  // When a duplicate fires, scroll the existing entry into view rather than
  // returning silently — otherwise the click looks like it did nothing.
  const dupIdx = entries.findIndex(e => e.lookupMode === 'matrikel'
        && e.matrikelnr === matrikelnr
        && e.ejerlavkode === ejerlavkode);
  if (dupIdx !== -1) {
    openSidebarMobile();
    scrollToEntry(dupIdx);
    return;
  }
  openSidebarMobile();

  const idx = entries.length;
  const lat = hit.click_lat;
  const lng = hit.click_lng;
  const marker = L.marker([lat, lng], { icon: numberedIcon(idx + 1) }).addTo(map);
  marker.on('click', () => { openSidebarMobile(); scrollToEntry(idx); });

  const entry = {
    label: provisionalLabel, lat, lng,
    epsg_25832: hit.click_epsg_25832 || null,
    data: null, error: null, loading: true, status: null,
    marker, salesHistory: null, salesLoading: false,
    lookupMode: 'matrikel',
    matrikelnr, ejerlavkode, ejerlavsnavn,
    bfenummer: hit.bfenummer || null,
    clickGeometry: hit.geometry || null,
  };
  entries.push(entry);
  renderSidebar();
  scrollToEntry(idx);
  // Draw the clicked parcel immediately so the user sees something while the
  // (slow) tingbog lookup runs. syncMatrikelOverlay will redraw the full set
  // once tingbog data arrives.
  syncMatrikelOverlay();

  await loadEntry(entry);
  scrollToEntry(entries.indexOf(entry));

  // Boligsiden sales history once the matrikel-flow resolved a concrete
  // address. The address-flow does this inline in addAddress(); we mirror
  // it here so map-clicks also get "Til salg" badges and the registreringer
  // table. Skipped if the lookup failed or no address came back (typical
  // for unbuilt parcels). Same fire-and-forget pattern as addAddress.
  const resolvedAddr = entry.data?._matrikel_fallback?.parent_adresse
    || entry.data?.adresse;
  if (entry.status === 'ok' && resolvedAddr) {
    entry.salesLoading = true;
    renderSidebar();
    fetch(`/api/sales-history?q=${encodeURIComponent(resolvedAddr)}`)
      .then(r => r.ok ? r.json() : null)
      .then(sh => { entry.salesHistory = sh; })
      .catch(() => { /* ignore — optional enrichment */ })
      .finally(() => {
        if (!entries.includes(entry)) return;
        entry.salesLoading = false;
        renderSidebar();
      });
  }
}

// Fetch /api/lookup for an entry, with one automatic retry on 5xx/network
// errors. On slow upstream tinglysning.dk we want to be patient rather than
// give up — the backend already caps each request at 45s and retries once
// on timeout, so worst-case per attempt is ~1.5 min.
async function loadEntry(entry) {
  entry.loading = true;
  entry.error = null;
  entry.status = 'loading';
  renderSidebar();

  const shouldRetry = (res, err) => {
    if (err) return true;                    // network / abort
    if (!res) return true;
    if (res.status === 429) return true;     // upstream rate-limit — retry after delay
    if (res.status >= 500) return true;      // 502/504 from our backend
    return false;
  };

  for (let attempt = 0; attempt < 2; attempt++) {
    let res = null, err = null, body = null;
    try {
      const url = entry.lookupMode === 'matrikel'
        ? `/api/lookup-matrikel?matrikelnr=${encodeURIComponent(entry.matrikelnr)}&ejerlavskode=${encodeURIComponent(entry.ejerlavkode)}&lat=${encodeURIComponent(entry.lat)}&lng=${encodeURIComponent(entry.lng)}`
        : `/api/lookup?q=${encodeURIComponent(entry.label)}`;
      res = await fetch(url);
    } catch (e) {
      err = e;
    }

    if (res && res.ok) {
      try {
        entry.data = await res.json();
        entry.error = null;
        entry.status = 'ok';
        if (entry.lookupMode === 'matrikel') {
          // Promote the resolved address as the entry label. Always annotate
          // with '(via matrikel X)' so the user knows this came from a click
          // rather than a typed address — the result may be a representative
          // tingbog if the matrikel hosts more than one ejendom.
          const addr = entry.data?._matrikel_fallback?.parent_adresse || entry.data?.adresse;
          if (addr) {
            entry.label = `${addr} (via matrikel ${entry.matrikelnr})`;
          }
        }
        saveToHistory(entry.label, entry.lat, entry.lng);
        const owners = (entry.data.ejere || []).map(e => `${esc(e.navn)} (${esc(e.andel)})`).join('<br>');
        entry.marker.bindPopup(`<div class="popup-address">${esc(entry.data.adresse || entry.label)}</div><div class="popup-owners">${owners}</div>`);
      } catch {
        entry.error = 'Uventet svar fra serveren.';
        entry.status = 'error';
      }
      entry.loading = false;
      renderSidebar();
      syncMatrikelOverlay();
      return;
    }

    // Non-OK or network error. Try to extract a message.
    if (res) {
      try { body = await res.json(); } catch { /* ignore */ }
    }

    if (attempt === 0 && shouldRetry(res, err) && entries.includes(entry)) {
      // Show a retry banner and wait 3s before trying again.
      entry.status = 'retrying';
      entry.error = null;
      renderSidebar();
      await new Promise(r => setTimeout(r, 3000));
      if (!entries.includes(entry)) return;  // user removed it while waiting
      continue;
    }

    // Final failure.
    entry.error = (body && body.detail) ||
                  (err ? 'Kunne ikke kontakte serveren.' : `Serverfejl (HTTP ${res.status})`);
    entry.status = 'error';
    entry.loading = false;
    renderSidebar();
    // Keep the clicked parcel on the map even when the tingbog lookup
    // failed — matrikel-mode entries still carry useful identity info.
    syncMatrikelOverlay();
    return;
  }
}

// Called from the "Prøv igen" button in the sidebar.
function retryEntry(i) {
  const entry = entries[i];
  if (!entry) return;
  loadEntry(entry);
}

function removeEntry(i) {
  map.removeLayer(entries[i].marker);
  entries.splice(i, 1);
  entries.forEach((e, j) => {
    e.marker.setIcon(numberedIcon(j + 1));
    e.marker.off('click');
    e.marker.on('click', () => scrollToEntry(j));
  });
  renderSidebar();
  syncMatrikelOverlay();
}

// Remove all results: cards, map markers, and the search input. Preserves
// theme and localStorage history.
function clearResults() {
  entries.forEach(e => { if (e.marker) map.removeLayer(e.marker); });
  entries.length = 0;
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  const sugg = document.getElementById('suggestions');
  if (sugg) sugg.hidden = true;
  map.setView([56.0, 10.5], 7);
  renderSidebar();
  syncMatrikelOverlay();
}

function scrollToEntry(idx) {
  const el = document.getElementById(`entry-${idx}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('results');
  const clearBtn = document.getElementById('clear-btn');
  if (entries.length === 0) {
    el.innerHTML = `<div class="empty-state"><img class="empty-logo" src="/favicon.svg" alt="" aria-hidden="true"><strong>Nosy Nabo</strong>Søg på en adresse eller klik på kortet.<br>Op til 10 adresser ad gangen.</div>`;
    if (clearBtn) clearBtn.hidden = true;
    return;
  }

  if (clearBtn) clearBtn.hidden = false;
  el.innerHTML = '';

  if (entries.length >= 10) {
    el.appendChild(html('<div class="limit-notice">Maks. 10 adresser nået — fjern en for at tilføje nye.</div>'));
  }

  entries.forEach((entry, i) => {
    const section = document.createElement('div');
    section.id = `entry-${i}`;

    const aerialUrl = skraafotoUrl(
      entry.epsg_25832,
      (Number.isFinite(entry.lat) && Number.isFinite(entry.lng))
        ? { lat: entry.lat, lng: entry.lng }
        : null,
    );
    const aerialLinkHtml = aerialUrl
      ? `<a class="entry-aerial" href="${esc(aerialUrl)}" target="_blank" rel="noopener noreferrer" title="Åbn i Skråfoto/Luftfoto">Luftfoto ↗</a>`
      : '';

    section.appendChild(html(`
      <div class="entry-header">
        <span class="entry-num">${i + 1}</span>
        <span class="entry-label">${esc(entry.label)}</span>
        ${aerialLinkHtml}
        <button class="entry-remove" onclick="removeEntry(${i})" title="Fjern">×</button>
      </div>
    `));

    if (entry.loading) {
      if (entry.status === 'retrying') {
        section.appendChild(html('<div class="spinner">Tinglysning.dk svarer langsomt — forsøger igen om et øjeblik…</div>'));
      } else {
        section.appendChild(html('<div class="spinner">Henter fra tinglysning.dk…</div>'));
      }
    } else if (entry.error) {
      // Matrikel-mode entries with an error still carry useful info from
      // /api/click (matrikelnr, ejerlav, bfenummer). Show that as a card so
      // the click isn't wasted — common case is unbebyggede marker without
      // an adgangsadresse, which tinglysning.dk's address-only API can't
      // look up but DAWA still knows about.
      if (entry.lookupMode === 'matrikel') {
        const oisLink = entry.bfenummer
          ? `<br><br><a href="https://www.ois.dk/search/${encodeURIComponent(entry.bfenummer)}/sfe" target="_blank" rel="noopener noreferrer">Slå op på OIS via BFE-nummeret &rarr;</a>`
          : '';
        section.appendChild(html(`
          <div class="card card-intro-paraply">
            <div class="card-title">Matrikel uden tingbog</div>
            <div class="card-blurb">
              <strong>Matrikel ${esc(entry.matrikelnr)}</strong>,
              ejerlav ${esc(entry.ejerlavsnavn || entry.ejerlavkode)}
              (kode ${esc(entry.ejerlavkode)}).
              ${entry.bfenummer ? `BFE-nummer: <strong>${esc(String(entry.bfenummer))}</strong>.` : ''}
              <br><br>
              ${esc(entry.error)}
              ${oisLink}
            </div>
          </div>
        `));
      } else {
        section.appendChild(html(`
          <div class="error-banner">
            ${esc(entry.error)}
            <button class="retry-btn" onclick="retryEntry(${i})">Prøv igen</button>
          </div>
        `));
      }
    } else if (entry.data) {
      renderEntryCards(section, entry.data, entry.salesHistory);
      if (entry.salesLoading) {
        section.appendChild(html('<div class="spinner">Henter salgshistorik fra Boligsiden…</div>'));
      }
    }

    el.appendChild(section);
    if (i < entries.length - 1) {
      el.appendChild(html('<hr class="entry-divider">'));
    }
  });
}

function renderEntryCards(container, d, salesHistory) {
  const hasAndelsbolig = !!d.andelsbolig;
  const hasEjendomsbog = !!(d.uuid && d.ejendomstype);

  if (hasAndelsbolig) {
    // Addresses that exist in Andelsboligbogen are cooperative dwellings.
    // Explain the two-book structure up front so the reader understands why
    // we show both the association's property and the member's individual
    // share below.
    container.appendChild(html(`
      <div class="card card-intro-andel">
        <div class="card-title">Andelsbolig</div>
        <div class="card-blurb">
          Denne adresse er registreret i <strong>Andelsboligbogen</strong>.
          ${hasEjendomsbog
            ? "Nedenfor vises både andelsforeningens fælles ejendom (fra Ejendomsbogen) og andelshaverens individuelle hæftelser (fra Andelsboligbogen)."
            : "Andelshaverens individuelle hæftelser vises nedenfor. Andelsforeningens fælles ejendom kunne ikke lokaliseres i Ejendomsbogen."}
        </div>
      </div>
    `));
  } else if (d._matrikel_fallback) {
    // Non-cooperative umbrella property: hospital, large farm, institution,
    // or an address that shares its matrikel with a parent property.
    const fb = d._matrikel_fallback;
    container.appendChild(html(`
      <div class="card card-intro-paraply">
        <div class="card-title">Fællesejendom / paraplyejendom</div>
        <div class="card-blurb">
          Den søgte adresse har ikke sin egen tingbog. Tingbogen nedenfor dækker
          hele ejendommen (matrikel <strong>${esc(fb.matrikelnr)}</strong>,
          ejerlav ${esc(fb.ejerlavskode)}), som typisk er en institution,
          almen boligorganisation eller anden paraplyejendom.
          ${fb.parent_adresse ? `Hovedadresse: <strong>${esc(fb.parent_adresse)}</strong>.` : ''}
        </div>
      </div>
    `));
  }

  if (hasEjendomsbog) {
    const forSaleHtml = (salesHistory && salesHistory.is_on_market && salesHistory.boligsiden_url)
      ? '<a href="' + esc(salesHistory.boligsiden_url) + '" target="_blank" rel="noopener noreferrer" class="address-for-sale-link">' + esc(d.adresse) + '</a><span class="for-sale-badge">Til salg</span>'
      : esc(d.adresse);
    container.appendChild(html(`
      <div class="card">
        <div class="address-header">${forSaleHtml}</div>
        <div class="property-type">${esc(d.ejendomstype)}</div>
      </div>
    `));
  }

  if (d.matrikler?.length) {
    const hasMatrikelArea = d.matrikler.some(m => Number.isFinite(m.areal_m2));
    const showTotal = hasMatrikelArea && Number.isFinite(d.grundareal_m2);
    container.appendChild(html(`
      <div class="card">
        <div class="card-title">Matrikler</div>
        <table class="matrikel-table">
          <thead><tr>
            <th>Matr.nr.</th>
            <th>Ejerlav</th>
            ${hasMatrikelArea ? `<th class="num">Areal</th>` : ''}
          </tr></thead>
          <tbody>${d.matrikler.map(m => `
            <tr>
              <td>${esc(m.matrikelnummer)}</td>
              <td>${esc(m.landsejerlavnavn)}</td>
              ${hasMatrikelArea ? `<td class="num">${Number.isFinite(m.areal_m2) ? `${fmt(Math.round(m.areal_m2))} m²` : '—'}</td>` : ''}
            </tr>
          `).join('')}</tbody>
          ${showTotal ? `<tfoot><tr>
            <td class="matrikel-total-label">I alt</td>
            <td></td>
            <td class="num">${formatArea(d.grundareal_m2)}</td>
          </tr></tfoot>` : ''}
        </table>
      </div>
    `));
  }

  if (d.vurdering) {
    const v = d.vurdering;
    const grundArealRow = Number.isFinite(d.grundareal_m2)
      ? `<tr><td>Grundareal</td><td>${formatArea(d.grundareal_m2)}</td></tr>`
      : '';
    const totalDebt = (d.haeftelser || []).reduce((sum, h) => {
      const principal = parseKr(h.hovedstol);
      const rate = parseFloat(h.rente) || 0;
      const months = loanAgeMonths(h.alias);
      const isRealkredit = ['Realkreditpantebrev', 'Afgiftspantebrev'].includes(h.haeftelsestype);
      if (isRealkredit && months !== null && rate > 0) {
        return sum + outstandingBalance(principal, rate, months, loanAssumption);
      }
      return sum + principal;
    }, 0);
    const frivaerdi = v.ejendomsvaerdi - totalDebt;
    const frivaerdiPct = v.ejendomsvaerdi > 0 ? Math.round(frivaerdi / v.ejendomsvaerdi * 100) : null;
    const assumptionLabels = { interest_only: 'Afdragsfri', deferred_10y: '10 år afdragsfri', repayment: 'Med afdrag' };
    const debtRow = totalDebt > 0 ? `
      <tr><td colspan="2">
        <div class="assumption-tabs">
          ${Object.entries(assumptionLabels).map(([k, lbl]) => `<div class="assumption-tab${loanAssumption === k ? ' active' : ''}" onclick="setLoanAssumption('${k}')">${lbl}</div>`).join('')}
        </div>
      </td></tr>
      <tr><td>Samlet pant (est.)</td><td>${fmt(Math.round(totalDebt))} kr.</td></tr>
      <tr><td>Friværdi (est.)</td><td class="${frivaerdi < 0 ? 'value-negative' : 'value-positive'}">${fmt(Math.round(frivaerdi))} kr.${frivaerdiPct !== null ? ` <span class="value-subtle">(${frivaerdiPct}%)</span>` : ''}</td></tr>
      <tr><td colspan="2" class="card-note">Est. af lyst pant - reel friværdi ofte højere.</td></tr>
    ` : `
      <tr><td>Samlet pant</td><td class="text-muted text-italic">— Ingen gæld —</td></tr>
      <tr><td>Friværdi</td><td class="value-positive">${fmt(v.ejendomsvaerdi)} kr. <span class="value-subtle">(100%)</span></td></tr>
    `;
    container.appendChild(html(`
      <div class="card">
        <div class="card-title">Vurdering (${esc(v.vurderingsdato)})</div>
        <table>
          <tr><td>Ejendomsværdi</td><td>${fmt(v.ejendomsvaerdi)} kr.</td></tr>
          <tr><td>Grundværdi</td><td>${fmt(v.grundvaerdi)} kr.</td></tr>
          ${grundArealRow}
          <tr><td>Kommune</td><td>${esc(v.kommune)}</td></tr>
          ${debtRow}
        </table>
      </div>
    `));
  }

  if (d.ejere?.length) {
    container.appendChild(html(`
      <div class="card">
        <div class="card-title">Ejere</div>
        <table>${d.ejere.map(e => `
          <tr><td>${esc(e.andel)}</td><td>${esc(e.navn)}</td></tr>
        `).join('')}</table>
      </div>
    `));
  }

  if (d.haeftelser?.length) {
    const card = html('<div class="card"><div class="card-title">Hæftelser</div></div>');
    d.haeftelser.forEach(h => card.appendChild(renderMortgage(h)));
    container.appendChild(card);
  }

  if (d.andelsbolig) {
    const a = d.andelsbolig;
    const shareLiens = a.haeftelser || [];
    const header = hasEjendomsbog
      ? 'Andelshaverens hæftelser <span class="card-note">(Andelsboligbogen — på andelen)</span>'
      : 'Hæftelser <span class="card-note">(Andelsboligbogen)</span>';
    if (shareLiens.length) {
      const card = html(`<div class="card card-andel-liens"><div class="card-title">${header}</div></div>`);
      shareLiens.forEach(h => card.appendChild(renderMortgage(h)));
      container.appendChild(card);
    } else {
      container.appendChild(html(`
        <div class="card card-andel-liens">
          <div class="card-title">${header}</div>
          <div class="card-blurb text-muted">Ingen hæftelser tinglyst på andelen.</div>
        </div>
      `));
    }
  }

  if (d.servitutter?.length) {
    container.appendChild(html(`
      <div class="card">
        <div class="card-title">Servitutter</div>
        ${d.servitutter.map(s => `<div class="easement">[${esc(s.prioritet)}] ${esc(s.tekst)}</div>`).join('')}
      </div>
    `));
  }

  if (salesHistory?.registrations?.length) {
    const monthsDa = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
    const shortDate = (iso) => {
      if (!iso) return '';
      const [y, m] = iso.split('-');
      return `${monthsDa[parseInt(m, 10) - 1] || m} ${y}`;
    };
    const rows = salesHistory.registrations.map(r => {
      const pricePerM2 = r.perAreaPrice ? `${fmt(r.perAreaPrice)}` : '—';
      return `<tr>
        <td>${shortDate(r.date)}</td>
        <td class="num">${fmt(r.amount)}</td>
        <td class="num">${pricePerM2}</td>
        <td>${esc(r.typeLabel || '')}</td>
      </tr>`;
    }).join('');
    container.appendChild(html(`
      <div class="card">
        <div class="card-title">Salgshistorik <span class="card-note">(via Boligsiden)</span></div>
        <table class="sales-history">
          <thead><tr><th>Dato</th><th class="num">Pris (kr.)</th><th class="num">Pris/m²</th><th>Type</th></tr></thead>
          ${rows}
        </table>
      </div>
    `));
  }
}

function renderMortgage(h) {
  const creditors = (h.kreditorer || []).map(esc).join(', ');
  const isVariable = h.fastvariabel === 'variabel';
  const regDate = h.alias ? h.alias.split('-')[0] : null;
  const lti = h.loan_type_info;

  let badgeHtml = '';
  let candidatesHtml = '';

  if (lti && isVariable) {
    if (lti.source === 'isin') {
      badgeHtml = `<span class="loan-type-badge badge-certain">${esc(lti.loan_type)} (ISIN)</span>`;
    } else if (lti.source === 'estimated') {
      if (lti.uncertain) {
        badgeHtml = `<span class="loan-type-badge badge-uncertain">Usikker (lav rente — ældre lån?)</span>`;
      } else {
        const cls = lti.close_to?.length ? 'badge-close' : 'badge-certain';
        const closeStr = lti.close_to?.length ? ` — tæt på ${esc(lti.close_to.join(', '))}` : '';
        badgeHtml = `<span class="loan-type-badge ${cls}">${esc(lti.loan_type)}${closeStr}</span>`;
      }

      if (lti.candidates?.length) {
        const maxDelta = Math.max(...lti.candidates.map(c => c.delta));
        candidatesHtml = `<div class="candidates">${lti.candidates.map((c, i) => `
          <div class="candidate ${i === 0 ? 'best' : ''}">
            <span>${esc(c.name)}</span>
            <span>Δ ${c.delta.toFixed(4)}%</span>
          </div>
          <div class="delta-bar-wrap"><div class="delta-bar" style="width:${maxDelta > 0 ? Math.round((1 - c.delta / maxDelta) * 100) : 100}%"></div></div>
        `).join('')}</div>`;
      }
    }
  }

  return html(`
    <div class="mortgage">
      <div class="mortgage-header">
        <span class="mortgage-type">[${esc(h.prioritet)}] ${esc(h.haeftelsestype)}</span>
        <span class="mortgage-amount">${esc(h.hovedstol)}</span>
      </div>
      <div class="mortgage-meta">
        ${esc(h.rente)}% · ${isVariable ? 'variabel' : 'fast'}
        ${creditors ? ' · ' + creditors : ''}
        ${regDate ? ' · ' + regDate : ''}
      </div>
      ${badgeHtml}
      ${candidatesHtml}
    </div>
  `);
}

function fmt(n) {
  return n.toLocaleString('da-DK');
}

function formatArea(m2) {
  if (!Number.isFinite(m2)) return '—';
  if (m2 < 10000) return `${fmt(Math.round(m2))} m²`;
  return `${(m2 / 10000).toLocaleString('da-DK', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ha`;
}

function parseKr(s) {
  // "1.200.000 kr." → 1200000 (Danish thousands separator is '.')
  return parseInt(String(s || '').replace(/\./g, '').replace(/\s*kr\.?/i, '').trim(), 10) || 0;
}

function html(str) {
  const t = document.createElement('template');
  t.innerHTML = str.trim();
  return t.content.firstChild;
}

// HTML-escape helper. Use for anything that comes from upstream APIs
// (owner names, addresses, easement texts, error messages from the
// backend) or from localStorage before interpolating it into a
// template literal. Prevents <, >, & and quote injection.
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Dark mode ─────────────────────────────────────────────────────────────
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('nosy-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('nosy-theme', 'dark');
  }
  updateThemeIcon();
}

function updateThemeIcon() {
  const btn = document.getElementById('darkmode-btn');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = isDark
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
}
updateThemeIcon();

// ── Search history (localStorage) ─────────────────────────────────────────
const HISTORY_KEY = 'nosy-history';
const HISTORY_MAX = 50;
const historyDropdown = document.getElementById('history-dropdown');

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch { return []; }
}

function saveToHistory(label, lat, lng) {
  let hist = loadHistory();
  hist = hist.filter(h => h.label !== label);
  hist.unshift({ label, lat, lng, ts: Date.now() });
  if (hist.length > HISTORY_MAX) hist = hist.slice(0, HISTORY_MAX);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
}

function clearHistory() {
  localStorage.removeItem(HISTORY_KEY);
  hideHistory();
}

function toggleHistory() {
  hideSuggestions();
  if (historyDropdown.style.display === 'block') {
    hideHistory();
  } else {
    renderHistory();
    historyDropdown.style.display = 'block';
  }
}

function hideHistory() {
  historyDropdown.style.display = 'none';
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (mins < 1) return 'lige nu';
  if (mins < 60) return `${mins} min siden`;
  if (hours < 24) return `${hours} time${hours > 1 ? 'r' : ''} siden`;
  if (days === 1) return 'i går';
  if (days < 7) return `${days} dage siden`;
  const d = new Date(ts);
  return d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
}

function renderHistory() {
  const hist = loadHistory();
  if (hist.length === 0) {
    historyDropdown.innerHTML = '<div class="history-empty">Ingen historik endnu</div>';
    return;
  }
  historyDropdown.innerHTML = hist.map((h, i) => `
    <div class="history-entry" data-i="${i}">
      <span class="history-label">${esc(h.label)}</span>
      <span class="history-time">${esc(timeAgo(h.ts))}</span>
    </div>
  `).join('') + '<button class="history-clear" onclick="clearHistory()">Ryd historik</button>';

  historyDropdown.querySelectorAll('.history-entry').forEach(el => {
    el.addEventListener('click', () => {
      const h = hist[+el.dataset.i];
      hideHistory();
      if (entries.length >= 10) return;
      map.setView([h.lat, h.lng], 16);
      addAddress(h.label, h.lat, h.lng);
    });
  });
}
